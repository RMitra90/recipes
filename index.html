<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RD's Recipe Book</title>
<meta name="description" content="Health-first meal prep recipes with serving scaling and a combined shopping list.">

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/recipe.css">
<link rel="stylesheet" href="css/shopping.css">

<!-- Order matters: data, then helpers, then state, then views, then bootstrap.
     Classic scripts rather than modules so the page also opens over file://. -->
<script defer src="js/data/breakfast.js"></script>
<script defer src="js/data/meals.js"></script>
<script defer src="js/format.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/recipe-view.js"></script>
<script defer src="js/shopping-view.js"></script>
<script defer src="js/app.js"></script>
</head>
<body>

<nav>
  <span class="brand">RD's Recipe Book</span>
  <ul class="nav-links" role="tablist">
    <li><button class="active" data-page="recipes" role="tab" aria-selected="true">Recipes</button></li>
    <li><button data-page="shopping" role="tab" aria-selected="false">Shopping list</button></li>
  </ul>
</nav>

<div class="hero">
  <p class="hero-eyebrow">Health-first · Meal prep · Custom</p>
  <h1>Built for <em>your</em> goals</h1>
  <p class="hero-sub">Every recipe tailored to your health goals, nutritionist guidance, and preferences.</p>
</div>

<main>
  <div id="page-recipes" class="page active" style="max-width:none;padding:0">
    <div class="page-tabs" role="tablist">
      <button class="page-tab active" data-cat="breakfast" role="tab" aria-selected="true">Breakfast</button>
      <button class="page-tab" data-cat="meals" role="tab" aria-selected="false">Meals</button>
    </div>
    <div id="cat-breakfast" class="cat-wrap"></div>
    <div id="cat-meals" class="cat-wrap" style="display:none"></div>
  </div>

  <div id="page-shopping" class="page">
    <div class="shop-header">
      <h2>Shopping list</h2>
      <button class="clear-btn" id="clear-checked">Clear checked</button>
    </div>
    <p class="progress-label" id="progress-label"></p>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div id="shopping-content"></div>
  </div>
</main>

<footer><strong>RD's Recipe Book</strong> — health-first recipes built around your goals</footer>

</body>
</html>
